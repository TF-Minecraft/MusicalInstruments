main: net.tfminecraft.musicalinstruments.InstrumentPlugin
version: ${project.version}
name: MusicalInstruments
author: Justin
api-version: '1.21.10'
softdepend: [TLibs, RPCharacters, MMOItems, ItemsAdder, Nexo]

commands:
  instruments:
    description: Musical instruments commands
    usage: /instruments <play|keybinds|list|give|reload>
  music:
    description: Record layered instrument tracks and publish playable discs
    usage: /music help
    aliases: [recording]

permissions:
  instruments.studio:
    description: Open the recording studio by command without a recording station (staff)
    default: op
  instruments.record:
    description: Use recording stations, create projects, record tracks and publish discs
    default: true
  instruments.play:
    description: Play recorded discs in jukeboxes
    default: true
  instruments.copy:
    description: Copy a recorded disc onto a blank disc
    default: true
  instruments.use:
    description: Use /instruments keybinds and list
    default: true
  instruments.give:
    description: Give instrument items with /instruments give
    default: op
  instruments.reload:
    description: Reload the config with /instruments reload
    default: op
