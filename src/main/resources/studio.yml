# Separate from config.yml, whose root entries remain instrument definitions.
# Restart the plugin/server after changing these settings.
max-tracks: 4
max-duration-seconds: 180
max-notes-per-track: 1500
max-notes-per-song: 6000
max-sessions: 32
jukebox-radius: 32
count-in-seconds: 3
sample-tail-seconds: 3
# Background checkpoints run at this interval. A hard crash loses work since
# the last completed checkpoint; stop/disconnect/shutdown save the complete take.
checkpoint-ticks: 200
# Minimum wait between a player's publications. Published editions are kept forever
# because discs reference them; republishing unchanged music reuses its edition. 0 disables.
publish-cooldown-seconds: 30
# New editions each player can publish in any 24 hours, which bounds how fast published
# songs grow on disk. Republishing music that is already published does not count. 0 disables.
max-editions-per-day: 20
# Right-clicking this block or furniture opens the studio (permission instruments.record).
#   v.<material>        vanilla block, e.g. v.loom (a jukebox cannot be used: it plays recorded discs)
#   ia.<namespace:id>   ItemsAdder custom block or furniture, e.g. ia.tfmc:music_station
# Leave empty to open the studio only with /music studio (instruments.studio, staff).
station: ia.tfmc:music_station
