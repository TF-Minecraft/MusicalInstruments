# On-screen instrument keyboard (7 notes x 3 octaves).
# Needs the tfmc_instruments:keyboard font from the server resource pack.
# Restart the plugin/server after changing these settings.
enabled: true
# Right-click with an instrument (main hand, or off hand with an empty main hand) opens it.
# /instruments play always works.
open-on-right-click: true
# small, medium or large. Players can change their own size under "Instrument Options...".
default-size: medium
# Flash and ring animation on the circle you play.
ring-effect: true
# Top row = high octave, middle row = the instrument's normal notes, bottom row = low octave.
# Instruments with a recorded second octave (their sneak sounds are *_single) use those
# recordings for the top row; otherwise the normal notes are pitched by these factors.
high-row-pitch: 2.0
low-row-pitch: 0.5
note-particles: true

# Optional: give an instrument its own sound for every cell instead of pitching its hotbar notes.
# rows = [top row, middle row, bottom row], each C D E F G A B. Sounds must exist in the resource pack.
instruments:
  celtic_harp:
    rows:
      - [tfmc_instruments:celtic_harp.c6, tfmc_instruments:celtic_harp.d6, tfmc_instruments:celtic_harp.e6, tfmc_instruments:celtic_harp.f6, tfmc_instruments:celtic_harp.g6, tfmc_instruments:celtic_harp.a6, tfmc_instruments:celtic_harp.b6]
      - [tfmc_instruments:celtic_harp.c5, tfmc_instruments:celtic_harp.d5, tfmc_instruments:celtic_harp.e5, tfmc_instruments:celtic_harp.f5, tfmc_instruments:celtic_harp.g5, tfmc_instruments:celtic_harp.a5, tfmc_instruments:celtic_harp.b5]
      - [tfmc_instruments:celtic_harp.c4, tfmc_instruments:celtic_harp.d4, tfmc_instruments:celtic_harp.e4, tfmc_instruments:celtic_harp.f4, tfmc_instruments:celtic_harp.g4, tfmc_instruments:celtic_harp.a4, tfmc_instruments:celtic_harp.b4]
